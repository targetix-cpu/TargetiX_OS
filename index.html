<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал Устройства | JAAM Style</title>
    <!-- Подключение Tailwind CSS для современного дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключение иконок Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Шапка сайта -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="cpu" class="w-8 h-8 text-blue-500"></i>
                <span class="text-xl font-bold tracking-wider uppercase text-white">JAAM <span class="text-blue-500">Device</span></span>
            </div>
            <nav class="flex gap-6 text-sm font-medium">
                <a href="#about" class="hover:text-blue-400 transition">О устройстве</a>
                <a href="#tools" class="hover:text-blue-400 transition">Инструменты</a>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow flex flex-col items-center text-center">
        
        <!-- Карточка устройства -->
        <div class="bg-gray-800/50 border border-gray-700/60 rounded-2xl p-6 sm:p-10 shadow-2xl backdrop-blur-sm w-full max-w-2xl">
            
            <!-- Заголовок -->
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-2">Портативное Устройство</h1>
            <p class="text-gray-400 mb-8 text-sm sm:text-base">Единый центр управления, обновления прошивки и технической документации.</p>

            <!-- Фото устройства -->
            <div class="relative group mb-8 overflow-hidden rounded-xl bg-gray-950 border border-gray-800 p-4">
                <img 
                    src="https://via.placeholder.com/600x400/1e293b/ffffff?text=Фото+Вашего+Устройства" 
                    alt="Устройство JAAM" 
                    class="w-full h-auto max-h-80 object-contain mx-auto transition-transform duration-300 group-hover:scale-105"
                >
            </div>

            <!-- Кнопки действий -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                
                <!-- Кнопка Прошивка (Ссылка на Web Tool) -->
                <a 
                    href="https://flasher.yourdomain.com" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30 hover:shadow-blue-500/50"
                >
                    <i data-lucide="download-cloud" class="w-5 h-5"></i>
                    <span>Прошивка (Web Tool)</span>
                </a>

                <!-- Кнопка Документация (Ссылка на сайт с PDF) -->
                <a 
                    href="https://docs.yourdomain.com" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="flex items-center justify-center gap-3 bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 border border-gray-600 hover:border-gray-500"
                >
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <span>Инструкции PDF</span>
                </a>

            </div>

        </div>

    </main>

    <!-- Подвал сайта -->
    <footer class="border-t border-gray-800 bg-gray-950 py-6 text-center text-sm text-gray-500">
        <div class="max-w-6xl mx-auto px-4">
            <p>&copy; 2026 JAAM Project. Все права защищены.</p>
        </div>
    </footer>

    <!-- Скрипт инициализации иконок -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
